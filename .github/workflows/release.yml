name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## OAuth2 Token Exchange — Flow Walkthrough

            First release of an end-to-end demonstration of **cross-IdP OAuth 2.0 Token Exchange ([RFC 8693](https://datatracker.ietf.org/doc/html/rfc8693))** using two Keycloak identity providers and two Spring Boot microservices.

            ### What's included

            - **Keycloak Alpha** (customer realm) and **Keycloak Beta** (warehouse realm) with federated IdP setup
            - **Order Service** — validates customer JWTs, performs token exchange, calls inventory
            - **Inventory Service** — accepts only warehouse-issued tokens
            - **Interactive walkthrough UI** at `http://localhost:8080` with architecture diagram and step-by-step HTTP/JWT traces
            - **CLI demo** via `scripts/demo.sh`
            - **Docker Compose** stack — `docker compose up --build` to run everything locally
            - **CI pipeline** — Maven build, Docker image build, and full-stack integration smoke test
            - **Documentation** — README plus guides in `docs/` (architecture, token exchange, API, configuration, troubleshooting)

            ### Quick start

            ```bash
            git clone https://github.com/Dr0na/oauth2-token-exchange-demo.git
            cd oauth2-token-exchange-demo
            docker compose up --build
            ```

            Open http://localhost:8080 and walk through the flow. Demo credentials: `alice` / `alice`.

            ### Requirements

            - Docker & Docker Compose v2
            - (Optional) Java 21 + Maven 3.9 for local development
