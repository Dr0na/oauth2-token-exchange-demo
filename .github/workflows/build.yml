name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    name: Maven · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, inventory-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp package -DskipTests

  docker:
    name: Docker · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: maven
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            context: order-service
            file: order-service/Dockerfile
          - service: inventory-service
            context: inventory-service
            file: inventory-service/Dockerfile
          - service: keycloak-setup
            context: .
            file: keycloak-setup/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: oauth2-token-exchange-demo/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration smoke test
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for services
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))

          echo "Waiting for Keycloak Alpha..."
          until curl -sf http://localhost:8180/realms/customer/.well-known/openid-configuration >/dev/null; do
            [[ $SECONDS -ge $deadline ]] && { docker compose logs; exit 1; }
            sleep 5
          done

          echo "Waiting for Keycloak Beta..."
          until curl -sf http://localhost:8181/realms/warehouse/.well-known/openid-configuration >/dev/null; do
            [[ $SECONDS -ge $deadline ]] && { docker compose logs; exit 1; }
            sleep 5
          done

          echo "Waiting for keycloak-setup..."
          if ! docker compose up keycloak-setup; then
            docker compose logs keycloak-setup
            exit 1
          fi

          echo "Waiting for inventory-service..."
          until curl -sf http://localhost:8081/actuator/health | grep -q UP; do
            [[ $SECONDS -ge $deadline ]] && { docker compose logs inventory-service; exit 1; }
            sleep 5
          done

          echo "Waiting for order-service..."
          until curl -sf http://localhost:8080/actuator/health | grep -q UP; do
            [[ $SECONDS -ge $deadline ]] && { docker compose logs order-service; exit 1; }
            sleep 5
          done

      - name: Token exchange walkthrough smoke test
        run: |
          set -euo pipefail
          TOKEN="$(curl -sf -X POST 'http://localhost:8180/realms/customer/protocol/openid-connect/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d 'grant_type=password' \
            -d 'client_id=order-portal' \
            -d 'scope=openid profile email' \
            -d 'username=alice' \
            -d 'password=alice' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")"

          RESPONSE="$(curl -sf "http://localhost:8080/api/demo/walkthrough/ORD-1001" \
            -H "Authorization: Bearer ${TOKEN}")"

          python3 - <<'PY' "${RESPONSE}"
          import json, sys
          data = json.loads(sys.argv[1])
          order_id = (data.get("result") or {}).get("order", {}).get("orderId")
          assert order_id == "ORD-1001", data
          steps = data.get("steps") or []
          assert len(steps) >= 4, f"expected walkthrough steps, got {len(steps)}"
          print("Smoke test passed:", order_id, f"({len(steps)} steps)")
          PY

      - name: Tear down
        if: always()
        run: docker compose down -v
