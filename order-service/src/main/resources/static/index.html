<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth2 Token Exchange — Flow Walkthrough</title>
  <style>
    :root {
      --bg: #020617;
      --panel: #0f172a;
      --border: rgba(148, 163, 184, 0.18);
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;
      --pending: #475569;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.95);
    }
    header h1 {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 1.35rem;
    }
    header p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.92rem;
      max-width: 900px;
      line-height: 1.5;
    }
    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 88px);
    }
    @media (max-width: 1100px) {
      .detail-layout { grid-template-columns: 1fr; }
      .diagram-column { position: static; }
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .timeline { border-right: none; border-bottom: 1px solid var(--border); }
    }
    .timeline {
      border-right: 1px solid var(--border);
      padding: 1rem;
      background: rgba(15, 23, 42, 0.6);
    }
    .timeline h2 {
      margin: 0 0 0.75rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .step-item {
      display: flex;
      gap: 0.65rem;
      padding: 0.65rem;
      border-radius: 8px;
      margin-bottom: 0.35rem;
      cursor: pointer;
      border: 1px solid transparent;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .step-item:hover { background: rgba(56, 189, 248, 0.06); }
    .step-item.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }
    .step-item.done .num { background: var(--ok); color: #022c22; }
    .step-item.error .num { background: var(--err); color: #450a0a; }
    .step-item.running .num { background: var(--warn); color: #422006; animation: pulse 1s infinite; }
    .num {
      flex: 0 0 1.6rem;
      height: 1.6rem;
      border-radius: 999px;
      background: var(--pending);
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .step-meta { min-width: 0; }
    .step-meta strong { display: block; font-size: 0.82rem; line-height: 1.3; }
    .step-meta span { color: var(--muted); font-size: 0.72rem; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    main { padding: 1rem 1.25rem 2rem; overflow: auto; }
    .controls, .inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: end;
      margin-bottom: 1rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .field label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .field input {
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font: inherit;
      width: 140px;
    }
    button {
      padding: 0.55rem 0.85rem;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #082f49;
      font-weight: 700;
      cursor: pointer;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .panel h3 {
      margin: 0 0 0.35rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: var(--accent);
      font-size: 1rem;
    }
    .panel .actor, .panel .desc {
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
      margin: 0 0 0.75rem;
    }
    .panel .actor strong { color: var(--text); }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.75rem;
    }
    .badge.completed { background: rgba(52, 211, 153, 0.15); color: var(--ok); }
    .badge.running { background: rgba(251, 191, 36, 0.15); color: var(--warn); }
    .badge.pending { background: rgba(71, 85, 105, 0.25); color: var(--muted); }
    .badge.error { background: rgba(248, 113, 113, 0.15); color: var(--err); }
    pre {
      margin: 0;
      padding: 0.75rem;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: auto;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0.75rem 0 0.35rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .notes {
      margin-top: 0.75rem;
      padding: 0.65rem 0.75rem;
      border-left: 3px solid var(--accent);
      background: rgba(56, 189, 248, 0.06);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.86rem;
      line-height: 1.5;
      color: #cbd5e1;
    }
    .statusbar {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .statusbar.ok { color: var(--ok); }
    .statusbar.err { color: var(--err); }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .flow-diagram {
      margin-top: 0;
      padding: 0;
      overflow: auto;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .flow-diagram svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .detail-layout {
      display: grid;
      grid-template-columns: minmax(340px, 1fr) minmax(380px, 1.1fr);
      gap: 1rem;
      align-items: start;
    }
    .diagram-panel, .step-panel {
      margin-bottom: 0;
      height: 100%;
    }
    .panel-heading {
      margin: 0 0 0.75rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .step-panel pre {
      max-height: 280px;
    }
    .diagram-column {
      position: sticky;
      top: 0.5rem;
    }
    .flow-entity {
      fill: #0f172a;
      stroke: rgba(148, 163, 184, 0.35);
      stroke-width: 1.5;
    }
    .flow-entity-label {
      fill: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
    }
    .flow-entity-sub {
      fill: #94a3b8;
      font-size: 10px;
    }
    .flow-arrow-line {
      stroke: #475569;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrowhead);
    }
    .flow-arrow-line.active {
      stroke: var(--accent);
      stroke-width: 2.5;
      marker-end: url(#arrowhead-active);
    }
    .flow-step-badge {
      fill: #1e293b;
      stroke: #475569;
      stroke-width: 1.5;
    }
    .flow-step-num {
      fill: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .flow-step-label {
      fill: #94a3b8;
      font-size: 9px;
      text-anchor: middle;
    }
    .flow-step-badge.active {
      fill: rgba(56, 189, 248, 0.2);
      stroke: var(--accent);
    }
    .flow-step-num.active { fill: var(--accent); }
    .flow-step-label.active { fill: #7dd3fc; }
    .flow-entity.active-box {
      stroke: var(--accent);
      fill: rgba(56, 189, 248, 0.08);
    }
  </style>
</head>
<body>
  <header>
    <h1>OAuth2 Token Exchange — Flow Walkthrough</h1>
    <p>
      Step through each hop like a debug session: customer login, order service call, JWT validation,
      RFC 8693 token exchange at the warehouse IdP, inventory API call, and final response assembly.
    </p>
  </header>

  <div class="layout">
    <aside class="timeline">
      <h2>Steps</h2>
      <div id="timeline"></div>
    </aside>

    <main>
      <div class="inputs">
        <div class="field"><label>Order ID</label><input id="orderId" value="ORD-1001"></div>
        <div class="field"><label>Username</label><input id="username" value="alice"></div>
        <div class="field"><label>Password</label><input id="password" type="password" value="alice"></div>
      </div>

      <div class="controls">
        <button id="btnStart">▶ Start</button>
        <button id="btnNext" class="secondary" disabled>Next step →</button>
        <button id="btnRunAll" class="secondary">Run all</button>
        <button id="btnReset" class="secondary">Reset</button>
        <label class="checkbox"><input type="checkbox" id="autoAdvance"> Auto-advance (1.2s)</label>
      </div>

      <div id="statusbar" class="statusbar">Ready — press Start or Next step to begin.</div>
      <div id="detail"></div>
    </main>
  </div>

  <script>
    const CONFIG = {
      alphaTokenUrl: 'http://localhost:8180/realms/customer/protocol/openid-connect/token',
      walkthroughBase: window.location.origin + '/api/demo/walkthrough'
    };

    const STEP_DEFS = [
      { step: 1, title: 'Obtain customer access token', actor: 'Browser → Keycloak Alpha' },
      { step: 2, title: 'Call order service walkthrough', actor: 'Browser → Order Service' },
      { step: 3, title: 'Validate customer JWT', actor: 'Order Service' },
      { step: 4, title: 'Exchange token (RFC 8693)', actor: 'Order Service → Keycloak Beta' },
      { step: 5, title: 'Call inventory API', actor: 'Order Service → Inventory Service' },
      { step: 6, title: 'Assemble response', actor: 'Order Service' }
    ];

    const state = {
      current: 0,
      steps: {},
      customerToken: null,
      tokenResponse: null,
      walkthroughResponse: null,
      running: false
    };

    const timelineEl = document.getElementById('timeline');
    const detailEl = document.getElementById('detail');
    const statusbar = document.getElementById('statusbar');
    const btnNext = document.getElementById('btnNext');

    function decodeJwt(token) {
      try {
        const payload = token.split('.')[1];
        return JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));
      } catch (_) {
        return { error: 'Unable to decode JWT' };
      }
    }

    function preview(token) {
      if (!token || token.length < 24) return token || '';
      return token.slice(0, 12) + '…' + token.slice(-8);
    }

    function renderTimeline() {
      timelineEl.innerHTML = STEP_DEFS.map(def => {
        const saved = state.steps[def.step];
        const cls = [
          'step-item',
          state.current === def.step ? 'active' : '',
          saved?.status === 'completed' ? 'done' : '',
          saved?.status === 'error' ? 'error' : '',
          saved?.status === 'running' ? 'running' : ''
        ].filter(Boolean).join(' ');
        return `<div class="${cls}" data-step="${def.step}">
          <div class="num">${def.step}</div>
          <div class="step-meta"><strong>${def.title}</strong><span>${def.actor}</span></div>
        </div>`;
      }).join('');

      timelineEl.querySelectorAll('.step-item').forEach(el => {
        el.addEventListener('click', () => {
          const step = Number(el.dataset.step);
          if (state.steps[step]) {
            state.current = step;
            renderTimeline();
            renderDetail(state.steps[step]);
          }
        });
      });
    }

    function renderFlowDiagram(activeStep = 0) {
      const current = activeStep || state.current;

      function stepClass(n) {
        return current === n ? 'active' : '';
      }

      function entityClass(id) {
        const linked = {
          browserTop: [1, 2],
          browserBottom: [6],
          keycloakAlpha: [1],
          order: [2, 3, 4, 5, 6],
          jwks: [3],
          beta: [4],
          inventory: [5]
        };
        const steps = linked[id] || [];
        return steps.includes(current) ? 'active-box' : '';
      }

      function busClass() {
        return '';
      }

      function arrow(n, x1, y1, x2, y2, lx, ly, label) {
        const cls = stepClass(n);
        return `
          <line class="flow-arrow-line ${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${cls === 'active' ? 'arrowhead-active' : 'arrowhead'})" />
          <circle class="flow-step-badge ${cls}" cx="${lx}" cy="${ly}" r="11" />
          <text class="flow-step-num ${cls}" x="${lx}" y="${ly + 1}">${n}</text>
          <text class="flow-step-label ${cls}" x="${lx}" y="${ly + 24}">${label}</text>
        `;
      }

      return `
        <div class="flow-diagram" aria-label="Token exchange flow between entities">
          <svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <polygon points="0 0, 8 4, 0 8" fill="#64748b" />
              </marker>
              <marker id="arrowhead-active" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <polygon points="0 0, 8 4, 0 8" fill="#38bdf8" />
              </marker>
            </defs>

            <!-- Entities -->
            <rect class="flow-entity ${entityClass('browserTop')}" x="30" y="24" width="110" height="54" rx="8" />
            <text class="flow-entity-label" x="85" y="46" text-anchor="middle">Browser</text>
            <text class="flow-entity-sub" x="85" y="64" text-anchor="middle">Alice (customer)</text>

            <rect class="flow-entity ${entityClass('keycloakAlpha')}" x="280" y="24" width="160" height="54" rx="8" />
            <text class="flow-entity-label" x="360" y="46" text-anchor="middle">Keycloak Alpha</text>
            <text class="flow-entity-sub" x="360" y="64" text-anchor="middle">Customer IdP · :8180</text>

            <rect class="flow-entity ${entityClass('order')}" x="30" y="130" width="130" height="54" rx="8" />
            <text class="flow-entity-label" x="95" y="152" text-anchor="middle">Order Service</text>
            <text class="flow-entity-sub" x="95" y="170" text-anchor="middle">Spring Boot · :8080</text>

            <rect class="flow-entity ${entityClass('jwks')}" x="280" y="118" width="160" height="54" rx="8" />
            <text class="flow-entity-label" x="360" y="138" text-anchor="middle">Alpha JWKS</text>
            <text class="flow-entity-sub" x="360" y="156" text-anchor="middle">JWT signature check</text>

            <rect class="flow-entity ${entityClass('beta')}" x="280" y="210" width="160" height="54" rx="8" />
            <text class="flow-entity-label" x="360" y="232" text-anchor="middle">Keycloak Beta</text>
            <text class="flow-entity-sub" x="360" y="250" text-anchor="middle">Warehouse IdP · :8181</text>

            <rect class="flow-entity ${entityClass('inventory')}" x="280" y="302" width="160" height="54" rx="8" />
            <text class="flow-entity-label" x="360" y="324" text-anchor="middle">Inventory Service</text>
            <text class="flow-entity-sub" x="360" y="342" text-anchor="middle">Warehouse API · :8081</text>

            <rect class="flow-entity ${entityClass('browserBottom')}" x="30" y="340" width="110" height="54" rx="8" />
            <text class="flow-entity-label" x="85" y="362" text-anchor="middle">Browser</text>
            <text class="flow-entity-sub" x="85" y="380" text-anchor="middle">order + inventory</text>

            <!-- Numbered arrows -->
            ${arrow(1, 140, 51, 280, 51, 210, 36, 'login / token')}
            ${arrow(2, 85, 78, 85, 130, 108, 104, 'Bearer token')}

            <line class="flow-arrow-line ${busClass()}" x1="160" y1="157" x2="175" y2="157" marker-end="none" />
            <line class="flow-arrow-line ${busClass()}" x1="175" y1="145" x2="175" y2="329" marker-end="none" />

            ${arrow(3, 175, 145, 280, 145, 227, 130, 'validate JWT')}
            ${arrow(4, 175, 237, 280, 237, 227, 222, 'RFC 8693 exchange')}
            ${arrow(5, 175, 329, 280, 329, 227, 314, 'warehouse token')}
            ${arrow(6, 95, 184, 95, 340, 118, 262, 'fulfillment JSON')}
          </svg>
        </div>
      `;
    }

    function renderStepPanel(step) {
      if (!step) {
        return `
          <div class="panel step-panel">
            <p class="panel-heading">Step details</p>
            <p class="desc">Select a step or press Start to begin the walkthrough.</p>
          </div>`;
      }

      return `
        <div class="panel step-panel">
          <p class="panel-heading">Step details</p>
          <span class="badge ${step.status}">${step.status}</span>
          <h3>Step ${step.step}: ${step.title}</h3>
          <p class="actor"><strong>Actor:</strong> ${step.actor}</p>
          <p class="desc">${step.description || ''}</p>
          ${step.durationMs ? `<p class="desc"><strong>Duration:</strong> ${step.durationMs} ms</p>` : ''}

          <div class="section-title">Request</div>
          <pre>${escapeHtml(formatRequest(step.request))}</pre>

          <div class="section-title">Response</div>
          <pre>${escapeHtml(formatResponse(step.response))}</pre>

          ${step.decodedJwt ? `<div class="section-title">Decoded JWT / claims</div><pre>${escapeHtml(JSON.stringify(step.decodedJwt, null, 2))}</pre>` : ''}
          ${step.notes ? `<div class="notes">${escapeHtml(step.notes)}</div>` : ''}
        </div>`;
    }

    function renderDetail(step) {
      const flowHtml = renderFlowDiagram(step?.step || 0);

      detailEl.innerHTML = `
        <div class="detail-layout">
          <div class="diagram-column">
            <div class="panel diagram-panel">
              <p class="panel-heading">Architecture flow</p>
              ${flowHtml}
            </div>
          </div>
          <div class="step-column">
            ${renderStepPanel(step)}
          </div>
        </div>`;
    }

    function formatRequest(req) {
      if (!req) return '(none)';
      const headers = req.headers && Object.keys(req.headers).length
        ? '\n' + Object.entries(req.headers).map(([k, v]) => `${k}: ${v}`).join('\n')
        : '';
      const body = req.body ? `\n\n${req.body}` : '';
      return `${req.method} ${req.url}${headers}${body}`;
    }

    function formatResponse(res) {
      if (!res) return '(none)';
      const headers = res.headers && Object.keys(res.headers).length
        ? '\n' + Object.entries(res.headers).map(([k, v]) => `${k}: ${v}`).join('\n')
        : '';
      const body = res.body ? `\n\n${res.body}` : '';
      return `${res.method || 'HTTP'} ${res.url}${headers}${body}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function setStatus(msg, ok = false, err = false) {
      statusbar.textContent = msg;
      statusbar.className = 'statusbar' + (ok ? ' ok' : err ? ' err' : '');
    }

    function saveStep(step) {
      state.steps[step.step] = step;
      state.current = step.step;
      renderTimeline();
      renderDetail(step);
    }

    async function runStep1() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const body = new URLSearchParams({
        grant_type: 'password',
        client_id: 'order-portal',
        scope: 'openid profile email',
        username,
        password
      });

      saveStep({
        step: 1,
        title: STEP_DEFS[0].title,
        actor: STEP_DEFS[0].actor,
        description: 'The browser authenticates Alice against the Customer Portal IdP (Keycloak Alpha, realm customer) using the resource-owner password grant. openid scope is required so Beta can validate the token via userinfo during exchange.',
        status: 'running',
        request: {
          method: 'POST',
          url: CONFIG.alphaTokenUrl,
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body.toString()
        },
        response: null,
        decodedJwt: null,
        notes: null,
        durationMs: 0
      });

      const started = performance.now();
      const response = await fetch(CONFIG.alphaTokenUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body
      });
      const json = await response.json();
      const durationMs = Math.round(performance.now() - started);

      if (!response.ok) {
        saveStep({
          ...state.steps[1],
          status: 'error',
          response: {
            method: 'POST',
            url: CONFIG.alphaTokenUrl,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(json, null, 2)
          },
          notes: 'Login failed — check credentials and that Keycloak Alpha is running on :8180.',
          durationMs
        });
        throw new Error('Step 1 failed');
      }

      state.customerToken = json.access_token;
      state.tokenResponse = json;

      const sanitized = { ...json, access_token: preview(json.access_token), refresh_token: preview(json.refresh_token) };
      saveStep({
        ...state.steps[1],
        status: 'completed',
        response: {
          method: 'POST',
          url: CONFIG.alphaTokenUrl,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sanitized, null, 2)
        },
        decodedJwt: decodeJwt(json.access_token),
        notes: 'This token is issued by Keycloak Alpha (iss=http://localhost:8180/realms/customer). It is valid for the order portal but NOT for the warehouse inventory API.',
        durationMs
      });
    }

    async function runStep2() {
      const orderId = document.getElementById('orderId').value.trim();
      const url = `${CONFIG.walkthroughBase}/${encodeURIComponent(orderId)}`;

      saveStep({
        step: 2,
        title: STEP_DEFS[1].title,
        actor: STEP_DEFS[1].actor,
        description: 'The browser sends the customer token to the order service walkthrough endpoint. Spring Security validates the JWT before the walkthrough logic runs server-side steps 3–6.',
        status: 'running',
        request: {
          method: 'GET',
          url,
          headers: { Authorization: 'Bearer ' + preview(state.customerToken), Accept: 'application/json' },
          body: ''
        },
        response: null,
        decodedJwt: null,
        notes: null,
        durationMs: 0
      });

      const started = performance.now();
      const response = await fetch(url, {
        headers: { Authorization: 'Bearer ' + state.customerToken, Accept: 'application/json' }
      });
      const text = await response.text();
      const durationMs = Math.round(performance.now() - started);

      if (!response.ok) {
        saveStep({
          ...state.steps[2],
          status: 'error',
          response: {
            method: 'GET',
            url,
            headers: { 'Content-Type': 'application/json' },
            body: text
          },
          notes: 'Walkthrough call failed. Ensure order service and Keycloak setup are running.',
          durationMs
        });
        throw new Error('Step 2 failed');
      }

      state.walkthroughResponse = JSON.parse(text);
      const stepCount = state.walkthroughResponse.steps?.length || 0;

      saveStep({
        ...state.steps[2],
        status: 'completed',
        response: {
          method: 'GET',
          url,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stepsReturned: stepCount, resultOrderId: state.walkthroughResponse.result?.order?.orderId }, null, 2)
        },
        decodedJwt: decodeJwt(state.customerToken),
        notes: `Server returned ${stepCount} traced steps (3–6). Continue to inspect each server-side hop.`,
        durationMs
      });

      for (const serverStep of state.walkthroughResponse.steps || []) {
        state.steps[serverStep.step] = serverStep;
      }
    }

    async function revealStep(n) {
      if (n <= 2) {
        if (n === 1) await runStep1();
        if (n === 2) await runStep2();
        return;
      }
      const step = state.steps[n];
      if (step) {
        state.current = n;
        renderTimeline();
        renderDetail(step);
      }
    }

    async function advance() {
      if (state.running) return;
      state.running = true;
      btnNext.disabled = true;

      try {
        const next = state.current === 0 ? 1 : state.current + 1;
        if (next > 6) {
          setStatus('Walkthrough complete.', true);
          return;
        }

        setStatus(`Running step ${next}…`);
        if (next === 1) await runStep1();
        else if (next === 2) await runStep2();
        else await revealStep(next);

        if (next < 6) {
          btnNext.disabled = false;
          setStatus(`Step ${next} complete. Press Next for step ${next + 1}.`, true);
        } else {
          setStatus('All 6 steps complete — token exchange demo finished.', true);
        }
      } catch (err) {
        setStatus(String(err.message || err), false, true);
      } finally {
        state.running = false;
      }
    }

    async function runAll() {
      reset(false);
      for (let i = 1; i <= 6; i++) {
        await advance();
        if (state.steps[i]?.status === 'error') break;
        if (document.getElementById('autoAdvance').checked && i < 6) {
          await new Promise(r => setTimeout(r, 1200));
        }
      }
    }

    function reset(clearStatus = true) {
      state.current = 0;
      state.steps = {};
      state.customerToken = null;
      state.tokenResponse = null;
      state.walkthroughResponse = null;
      btnNext.disabled = true;
      renderTimeline();
      renderDetail(null);
      if (clearStatus) setStatus('Ready — press Start or Next step to begin.');
    }

    document.getElementById('btnStart').addEventListener('click', async () => {
      reset(false);
      state.current = 0;
      await advance();
    });

    btnNext.addEventListener('click', advance);
    document.getElementById('btnRunAll').addEventListener('click', runAll);
    document.getElementById('btnReset').addEventListener('click', () => reset());

    renderTimeline();
    renderDetail(null);
  </script>
</body>
</html>
